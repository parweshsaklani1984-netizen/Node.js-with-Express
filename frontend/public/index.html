<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Submission</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; color: #1d2733; background: #f3efe7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); background: #fffdf8; border: 1px solid #d8cdbd; padding: 40px; box-shadow: 12px 12px 0 #c8d8d0; }
    h1 { margin-top: 0; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1; }
    p { color: #58636c; line-height: 1.5; }
    label { display: block; margin: 20px 0 7px; font-weight: bold; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #a9b5b5; background: #f8faf7; padding: 12px; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button { margin-top: 24px; border: 0; background: #d95d39; color: white; padding: 13px 20px; font: bold 1rem Georgia, serif; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { min-height: 1.5em; margin-top: 20px; font-weight: bold; }
    .error { color: #a32e2e; }
    .success { color: #28704d; }
  </style>
</head>
<body>
  <main>
    <p>FLASK ASSIGNMENT / EXPRESS FRONTEND</p>
    <h1>Send your response.</h1>
    <p>Enter your details below. Express forwards the submission to Flask for validation and processing.</p>
    <form id="assignment-form">
      <label for="name">Name</label>
      <input id="name" name="name" required maxlength="100">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="254">
      <label for="message">Response</label>
      <textarea id="message" name="message" required maxlength="2000"></textarea>
      <button type="submit">Submit response</button>
    </form>
    <div id="result" role="status"></div>
  </main>
  <script>
    const form = document.querySelector('#assignment-form');
    const result = document.querySelector('#result');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.className = '';
      result.textContent = 'Sending...';
      button.disabled = true;

      const data = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Submission failed.');
        result.className = 'success';
        result.textContent = payload.message;
        form.reset();
      } catch (error) {
        result.className = 'error';
        result.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
